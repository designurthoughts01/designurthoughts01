>'https://wa.me/'+String(n||'').replace(/\D/g,'');function driveId(url){const s=String(url||'').trim(),m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/i),q=s.match(/[?&]id=([^&]+)/i);return m?m[1]:(/drive\.google\.com/i.test(s)&&q?q[1]:'')}function imageUrl(url){const x=driveId(url);return x?`https://drive.google.com/thumbnail?id=${encodeURIComponent(x)}&sz=w1920`:String(url||'').trim()}function videoUrl(url){const x=driveId(url);return x?`https://drive.google.com/file/d/${encodeURIComponent(x)}/preview`:String(url||'').trim()}const el=x=>document.getElementById(x);function mediaList(p){if(Array.isArray(p.media)&&p.media.length)return p.media.filter(x=>x&&x.url).slice(0,5);return p.image?[{url:p.image,type:'image'}]:[]}function mediaHtml(m){if((m.type||'image')==='video')return`<iframe src="${esc(videoUrl(m.url))}" title="Product video" allow="autoplay" allowfullscreen></iframe>`;return`<img src="${esc(imageUrl(m.url))}" alt="Product image">`}async function load(){try{const cfg=await getDoc(doc(db,'config','settings')),st=cfg.exists()?cfg.data():{};applySettings(st);if(!id){error('Product not specified.');return}const snap=await getDoc(doc(db,'products',id));if(!snap.exists()||snap.data().active===false){error('This product is currently unavailable.');return}const p={id:snap.id,...snap.data()},opts=Array.isArray(p.options)?p.options:[],media=mediaList(p);el('app').innerHTML=`<div class="box"><div class="gallery"><div class="main-media" id="mainMedia">${media.length?mediaHtml(media[0]):'<span class="media-empty">Product media</span>'}</div>${media.length>1?`<div class="thumbs">${media.map((m,i)=>`<button class="thumb ${i===0?'active':''}" type="button" data-media="${i}">${(m.type||'image')==='video'?'<span class="thumb-video">▶ Video</span>':`<img src="${esc(imageUrl(m.url))}" alt="Media ${i+1}">`}</button>`).join('')}</div>`:''}</div><div class="info"><h1>${esc(p.name||'Custom Resin Art')}</h1><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="desc">${esc(p.description||'Handcrafted to order and customised for you.')}</div><div class="options">${opts.map(field).join('')}<div class="field"><label>Special Request</label><textarea id="special" placeholder="Tell us anything else you would like customised..."></textarea></div></div><button class="cta" id="orderBtn">Request Custom Order on WhatsApp</button><div class="note">Estimated build time: ${esc(p.buildTime||'To be confirmed')}</div></div></div>`;document.querySelectorAll('[data-media]').forEach(btn=>btn.addEventListener('click',()=>{const i=Number(btn.dataset.media);el('mainMedia').innerHTML=mediaHtml(media[i]);document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}));el('orderBtn').onclick=()=>{const n=st.whatsappAdmin||st.whatsappNumber||st.whatsapp;if(!n){alert('WhatsApp contact is not configured yet.');return}const lines=[`Product: ${p.name}`,`Price: ₹${Number(p.price||0).toLocaleString('en-IN')}`,...opts.map((o,i)=>`${o.label}: ${el('opt'+i)?.value||''}`),`Special Request: ${el('special').value||''}`];location.href=wa(n)+'?text='+encodeURIComponent(lines.join('\n'))}}catch(e){console.error(e);error('Unable to load this product right now.')}}function field(o,i){const type=o.type||'select',label=esc(o.label||'Option');if(type==='textarea')return`<div class="field"><label>${label}</label><textarea id="opt${i}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;if(type==='text')return`<div class="field"><label>${label}</label><input id="opt${i}" placeholder="${esc(o.placeholder||'')}"></div>`;return`<div class="field"><label>${label}</label><select id="opt${i}"><option value="">Select ${label}</option>${(Array.isArray(o.values)?o.values:[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`}function error(t){el('app').innerHTML=`<div class="box error"><h1>${esc(t)}</h1><a href="index.html">Return to Home</a></div>`}load();</script></body></html>
