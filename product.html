<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | DESIGN_UR_THOUGHTS_01</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#32283a;--muted:#746a78;--cream:#fffaf6;--gold:#b48a3b;--rose:#e7a1b2;--line:#eadfe4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffaf6,#fff4f7,#f2fcf8);color:var(--ink);font-family:Manrope,sans-serif}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.top{padding:22px 0}.back{font-size:13px;font-weight:700}.box{background:#ffffffe8;border:1px solid var(--line);box-shadow:0 25px 70px #49324b18;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.photo{min-height:560px;background:linear-gradient(135deg,#ffe7ee,#edf9f5,#f4effd);display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:48px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800}.info h1{font:600 52px/1 'Cormorant Garamond',serif;margin:12px 0}.price{font-weight:800;font-size:20px}.desc{color:var(--muted);font-size:14px;margin:18px 0 28px}.options{display:grid;gap:15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.cta{margin-top:22px;width:100%;padding:14px;border:0;border-radius:99px;background:linear-gradient(100deg,#b98b4a,#d8ad63);color:#fff;font-weight:800}.note{font-size:11px;color:var(--muted);margin-top:12px}.error{padding:60px;text-align:center}@media(max-width:760px){.box{grid-template-columns:1fr}.photo{min-height:360px}.info{padding:30px}.info h1{font-size:44px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← Back to DESIGN_UR_THOUGHTS_01</a></div><div id="app"></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'}),db=getFirestore(app);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const wa=n=>'https://wa.me/'+String(n||'').replace(/\D/g,'');const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){showError('Product not specified.');return}const s=await getDoc(doc(db,'products',id));if(!s.exists()||s.data().active===false){showError('This product is currently unavailable.');return}const p={id:s.id,...s.data()};document.title=`${p.name||'Product'} | DESIGN_UR_THOUGHTS_01`;const opts=Array.isArray(p.options)?p.options:[];document.getElementById('app').innerHTML=`<div class="box"><div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<span>Product image</span>'}</div><div class="info"><div class="eyebrow">${esc(p.subcategory||'Bespoke')}</div><h1>${esc(p.name||'Custom Resin Art')}</h1><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="desc">${esc(p.description||'Handcrafted to order and customised for you.')}</div><div class="options">${opts.map((o,i)=>field(o,i)).join('')}<div class="field"><label>Special Request</label><textarea id="special" placeholder="Tell us anything else you'd like customised..."></textarea></div></div><button class="cta" id="order">Request Custom Order on WhatsApp</button><div class="note">Estimated build time: ${esc(p.buildTime||'To be confirmed')}</div></div></div>`;document.getElementById('order').onclick=async()=>{const cfg=await getDoc(doc(db,'config','settings'));const phone=cfg.exists()?cfg.data().whatsappAdmin:'';const lines=[`Product: ${p.name}`,`Price: ₹${Number(p.price||0).toLocaleString('en-IN')}`,...opts.map((o,i)=>`${o.label}: ${document.getElementById('opt'+i)?.value||''}`),`Special Request: ${document.getElementById('special').value}`];location.href=wa(phone)+'?text='+encodeURIComponent(lines.join('\n'))}}function field(o,i){const type=o.type||'select';if(type==='textarea')return `<div class="field"><label>${esc(o.label)}</label><textarea id="opt${i}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;if(type==='text')return `<div class="field"><label>${esc(o.label)}</label><input id="opt${i}" placeholder="${esc(o.placeholder||'')}"></div>`;const vals=Array.isArray(o.values)?o.values:[];return `<div class="field"><label>${esc(o.label)}</label><select id="opt${i}"><option value="">Select ${esc(o.label)}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`}function showError(t){document.getElementById('app').innerHTML=`<div class="box error"><h1>${esc(t)}</h1><a class="back" href="index.html">Return to collection</a></div>`}load().catch(e=>{console.error(e);showError('Unable to load this product right now.')});</script></body></html>
