name: Apply offer upload improvements
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[offer-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch offer upload and redirect controls
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          admin = Path('admin.html').read_text(encoding='utf-8')
          admin = admin.replace("import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js'", "import{getStorage,ref,uploadBytesResumable,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js'")
          admin = admin.replace(".progress{font-size:11px;color:var(--muted);min-height:18px}", ".progress{font-size:11px;color:var(--muted);min-height:18px;margin-top:6px}.offer-progress{height:7px;width:100%;display:block;margin-top:6px;accent-color:var(--gold)}.offer-link-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.offer-response{font-family:monospace;font-size:10px;white-space:pre-wrap;word-break:break-word}")
          admin = admin.replace("ongoingOfferImages:[]", "ongoingOfferImages:[],ongoingOfferLinks:[]")

          old_controls = re.compile(r"function renderOfferControls\(\)\{.*?\}window\.clearOffer=i=>\{.*?\};", re.S)
          new_controls = r'''function offerLinkOptions(i){const current=(SETTINGS.ongoingOfferLinks||[])[i]||{};const type=current.type||'none',target=current.target||'';const cats=CATS.filter(c=>c.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}));const products=PRODUCTS.filter(p=>p.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}));let targetHtml=`<input id="offerTarget${i}" value="${esc(target)}" placeholder="https://example.com/...">`;if(type==='collection')targetHtml=`<select id="offerTarget${i}"><option value="">Select collection</option>${cats.map(c=>`<option value="${esc(c.id)}" ${target===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;if(type==='product')targetHtml=`<select id="offerTarget${i}"><option value="">Select product</option>${products.map(p=>`<option value="${esc(p.id)}" ${target===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;return`<div class="offer-link-grid"><select id="offerLinkType${i}" onchange="offerLinkTypeChanged(${i})"><option value="none" ${type==='none'?'selected':''}>No action</option><option value="home" ${type==='home'?'selected':''}>Home</option><option value="collection" ${type==='collection'?'selected':''}>Collection</option><option value="product" ${type==='product'?'selected':''}>Product</option><option value="custom" ${type==='custom'?'selected':''}>Custom URL</option></select><div id="offerTargetWrap${i}">${type==='home'?'<div class="muted" style="padding:11px 0">Redirects to Home</div>':targetHtml}</div></div>`}
          function renderOfferControls(){const box=$('offerAdminGrid'),urls=Array.isArray(SETTINGS.ongoingOfferImages)?SETTINGS.ongoingOfferImages:[];box.innerHTML=Array.from({length:5},(_,i)=>{const u=urls[i]||'';return`<div class="offer-item"><b>Offer Image ${i+1}</b><img id="offerPreview${i}" class="offer-preview" src="${u?esc(u):''}" style="${u?'display:block':'display:none'}"><input id="offerUrl${i}" value="${esc(u)}" placeholder="Firebase image URL or public image URL"><div class="offer-actions" style="margin-top:8px"><input id="offerFile${i}" type="file" accept="image/*" style="padding:7px" onchange="handleOfferFile(${i},this.files[0])"><button class="btn sm" type="button" onclick="clearOffer(${i})">Clear</button></div><progress id="offerBar${i}" class="offer-progress" value="0" max="100" style="display:none"></progress><div id="offerProgress${i}" class="progress"></div>${offerLinkOptions(i)}</div>`}).join('')}
          window.offerLinkTypeChanged=i=>{const type=$('offerLinkType'+i).value,wrap=$('offerTargetWrap'+i);if(type==='home'){wrap.innerHTML='<div class="muted" style="padding:11px 0">Redirects to Home</div>';return}const cats=CATS.filter(c=>c.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}));const products=PRODUCTS.filter(p=>p.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}));if(type==='collection'){wrap.innerHTML=`<select id="offerTarget${i}"><option value="">Select collection</option>${cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>`}else if(type==='product'){wrap.innerHTML=`<select id="offerTarget${i}"><option value="">Select product</option>${products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>`}else if(type==='custom'){wrap.innerHTML='<input id="offerTarget'+i+'" placeholder="https://example.com/...">'}else{wrap.innerHTML='<div class="muted" style="padding:11px 0">Image will not be clickable</div>'}}
          window.clearOffer=i=>{$('offerUrl'+i).value='';$('offerFile'+i).value='';$('offerPreview'+i).style.display='none';$('offerProgress'+i).textContent='';$('offerBar'+i).style.display='none';$('offerBar'+i).value=0;$('offerLinkType'+i).value='none';offerLinkTypeChanged(i)};'''
          admin, n = old_controls.sub(new_controls, admin, count=1)
          if n != 1: raise SystemExit('Could not patch offer controls')

          old_upload = re.compile(r"async function uploadOffer\(i,file\)\{.*?\}window\.saveOffers=async\(\)=>\{.*?\};", re.S)
          new_upload = r'''const offerUploads={};const offerUploadUrls={};
          async function uploadOffer(i,file){if(!file)return $('offerUrl'+i).value.trim();const progress=$('offerProgress'+i),bar=$('offerBar'+i);if(offerUploads[i]){try{offerUploads[i].cancel()}catch{}}progress.textContent='Preparing upload…';bar.style.display='block';bar.value=0;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),r=ref(storage,`offers/${Date.now()}-${i}-${safe}`);const metadata={contentType:file.type||'image/jpeg',cacheControl:'public,max-age=3600'};const task=uploadBytesResumable(r,file,metadata);offerUploads[i]=task;return await new Promise((resolve,reject)=>{task.on('state_changed',snap=>{const pct=Math.round((snap.bytesTransferred/snap.totalBytes)*100);bar.value=pct;progress.textContent=`Uploading ${pct}% · ${(snap.bytesTransferred/1024/1024).toFixed(2)} / ${(snap.totalBytes/1024/1024).toFixed(2)} MB`},err=>{offerUploads[i]=null;bar.style.display='none';progress.textContent=`Upload failed: ${err.code||'unknown'} — ${err.message||err}`;reject(err)},async()=>{try{const url=await getDownloadURL(task.snapshot.ref);offerUploads[i]=null;offerUploadUrls[i]=url;$('offerUrl'+i).value=url;$('offerPreview'+i).src=url;$('offerPreview'+i).style.display='block';bar.value=100;progress.textContent='Uploaded ✓ Firebase URL ready. Click Save to publish this offer.';resolve(url)}catch(err){offerUploads[i]=null;bar.style.display='none';progress.textContent=`URL failed: ${err.code||'unknown'} — ${err.message||err}`;reject(err)}})})}
          window.handleOfferFile=async(i,file)=>{if(!file)return;try{await uploadOffer(i,file)}catch(e){console.error('Offer upload',i,e)}};
          function readOfferLinks(){return Array.from({length:5},(_,i)=>{const type=$('offerLinkType'+i).value;if(type==='none')return{type:'none',target:''};if(type==='home')return{type:'home',target:'index.html'};const target=String($('offerTarget'+i)?.value||'').trim();return{type,target}})}
          window.saveOffers=async()=>{const msg=$('offerMsg');msg.classList.remove('offer-response');msg.textContent='Saving offer settings…';try{const pending=Object.values(offerUploads).filter(Boolean);if(pending.length)throw new Error('Please wait for all image uploads to finish.');const urls=[];for(let i=0;i<5;i++)urls[i]=$('offerUrl'+i).value.trim();while(urls.length&&!urls[urls.length-1])urls.pop();const links=readOfferLinks();for(let i=0;i<links.length;i++){if(links[i].type==='collection'&&!links[i].target)throw new Error(`Offer ${i+1}: select a collection.`);if(links[i].type==='product'&&!links[i].target)throw new Error(`Offer ${i+1}: select a product.`);if(links[i].type==='custom'&&links[i].target&&!/^https?:\/\//i.test(links[i].target))throw new Error(`Offer ${i+1}: custom URL must start with http:// or https://.`)}SETTINGS={...SETTINGS,ongoingOffersEnabled:$('offersEnabled').checked,ongoingOfferImages:urls.slice(0,5),ongoingOfferLinks:links.slice(0,5)};const payload={ongoingOffersEnabled:SETTINGS.ongoingOffersEnabled,ongoingOfferImages:SETTINGS.ongoingOfferImages,ongoingOfferLinks:SETTINGS.ongoingOfferLinks};await setDoc(doc(db,'config','settings'),payload,{merge:true});msg.classList.add('offer-response');msg.textContent=`Saved ✓\nFirestore: config/settings\nImages: ${payload.ongoingOfferImages.length}\nLinks configured: ${payload.ongoingOfferLinks.filter(x=>x.type!=='none').length}`;renderOfferControls()}catch(e){console.error(e);msg.classList.add('offer-response');msg.textContent=`Save failed\n${e.code||e.name||'error'}: ${e.message||e}`}};'''
          admin, n = old_upload.sub(new_upload, admin, count=1)
          if n != 1: raise SystemExit('Could not patch upload/save functions')
          Path('admin.html').write_text(admin,encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          old_render = re.compile(r"function normalizeOfferUrl\(url\)\{.*?\}function renderOffers\(st\)\{.*?\}async function load\(\)", re.S)
          new_render = r'''function normalizeOfferUrl(url){const s=String(url||'').trim();if(!s)return'';const m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/i);if(m)return`https://drive.google.com/thumbnail?id=${encodeURIComponent(m[1])}&sz=w1920`;const q=s.match(/[?&]id=([^&]+)/i);if(/drive\.google\.com/i.test(s)&&q)return`https://drive.google.com/thumbnail?id=${encodeURIComponent(q[1])}&sz=w1920`;return s}function normalizeOfferLink(link){if(!link)return'';if(typeof link==='string')return link.trim();const type=link.type||'none',target=String(link.target||'').trim();if(type==='home')return'index.html';if(type==='collection'&&target)return`index.html#cat-${encodeURIComponent(target)}`;if(type==='product'&&target)return`product.html?id=${encodeURIComponent(target)}`;if(type==='custom'&&target)return target;return''}function renderOffers(st){const section=document.getElementById('ongoingOffers'),rawUrls=st.ongoingOffersEnabled===false?[]:(Array.isArray(st.ongoingOfferImages)?st.ongoingOfferImages.slice(0,5):[]),links=Array.isArray(st.ongoingOfferLinks)?st.ongoingOfferLinks:[],items=rawUrls.map((u,i)=>({src:normalizeOfferUrl(u),href:normalizeOfferLink(links[i])})).filter(x=>x.src);if(st.ongoingOffersEnabled===false){section.style.display='none';clearInterval(offerTimer);return}section.style.display='block';const stage=document.getElementById('offerStage');if(!items.length){stage.innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;padding:0">Offers will appear here.</div>';clearInterval(offerTimer);return}stage.innerHTML=items.map((item,i)=>{const image=`<img class="offer-slide ${i===0?'active':''}" src="${esc(item.src)}" alt="Ongoing offer ${i+1}" loading="${i===0?'eager':'lazy'}">`;return item.href?`<a class="offer-slide-link ${i===0?'active':''}" href="${esc(item.href)}" ${/^https?:\/\//i.test(item.href)?'target="_blank" rel="noopener"':''}>${image}</a>`:image}).join('');let i=0;clearInterval(offerTimer);offerTimer=setInterval(()=>{const slides=stage.querySelectorAll('.offer-slide,.offer-slide-link');if(!slides.length)return;slides[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active')},2000)}async function load()'''
          index, n = old_render.sub(new_render, index, count=1)
          if n != 1: raise SystemExit('Could not patch index offer renderer')
          index=index.replace(".offer-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease}.offer-slide.active{opacity:1}", ".offer-slide,.offer-slide-link{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .55s ease}.offer-slide{object-fit:cover}.offer-slide-link{display:block}.offer-slide-link .offer-slide{position:absolute}.offer-slide.active,.offer-slide-link.active{opacity:1}")
          Path('index.html').write_text(index,encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html index.html
          git diff --cached --quiet || git commit -m "Improve offer uploads and clickable redirects [offer-patch]"
          git push origin dev
      - name: Remove temporary patch workflow
        if: success()
        run: |
          git rm .github/workflows/apply-offer-patch.yml
          git commit -m "Remove temporary offer patch workflow [offer-patch]"
          git push origin dev
