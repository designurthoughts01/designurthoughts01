<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resin Calculator | DESIGN_UR_THOUGHTS_01</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#32283a;--muted:#746a78;--cream:#fffaf6;--gold:#b48a3b;--line:#eadfe4;--shadow:0 20px 55px #49324b18}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,sans-serif;color:var(--ink)}body{min-height:100vh;display:flex;flex-direction:column;background:var(--cream)}body:before{content:'';position:fixed;top:0;left:0;right:0;height:54vh;z-index:-2;background:linear-gradient(90deg,#fffaf6e3,#fffaf685),url('https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=1800&q=85') center/cover no-repeat}body:after{content:'';position:fixed;inset:54vh 0 0;z-index:-3;background:var(--cream)}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}.content{width:min(900px,calc(100% - 32px));margin:auto;padding:42px 0 70px;flex:1}.box{background:#fffffff0;border:1px solid #eadfe4d9;border-radius:6px;padding:38px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:800}.box h1{font:600 50px/1 'Cormorant Garamond',serif;margin:10px 0}.intro{color:var(--muted);font-size:13px}.field{margin:20px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}.ratios,.units,.modes{display:flex;gap:9px;flex-wrap:wrap}.ratios button,.modes button{border:1px solid var(--line);background:#fff;padding:11px 21px;border-radius:99px;font-weight:800}.ratios button.active,.modes button.active{background:linear-gradient(100deg,#b98b4a,#d8ad63);color:#fff;border-color:transparent}.shapes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shape{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;font-weight:800}.shape.active{border-color:#c39a50;background:linear-gradient(135deg,#fff9ef,#fff3f6)}.shape-icon{display:block;margin:0 auto 8px;width:48px;height:40px}.shape-icon.rect{border:2px solid var(--gold);border-radius:4px}.shape-icon.circle{border:2px solid var(--gold);border-radius:50%;width:40px;height:40px}.radio{display:flex!important;align-items:center;gap:8px;font-size:13px!important;font-weight:700!important;cursor:pointer}.radio input{width:17px!important;height:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.rate-toggle{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.rate-toggle input{width:17px;height:17px}.result{margin-top:28px;padding:22px;border-radius:16px;background:linear-gradient(135deg,#fff4d9,#fff1f5,#effaf6);border:1px solid #eadfe4}.result .total{font:600 31px 'Cormorant Garamond',serif}.cost{margin-top:10px;font-size:16px}.hidden{display:none!important}@media(max-width:700px){.box h1{font-size:42px}.box{padding:25px}.row{grid-template-columns:1fr}}@media(max-width:560px){.content{width:min(100% - 24px,900px)}}</style><script type="module">import './site-shell.js';</script></head><body><main class="content"><div class="box"><div class="eyebrow">Bespoke resin planning</div><h1>Resin Calculator</h1><p class="intro">Choose casting or coating, your resin-to-hardener ratio and dimensions to estimate the required resin mix.</p><div class="field"><label>Application</label><div class="modes"><button data-mode="casting" class="active">Casting</button><button data-mode="coating">Coating</button></div></div><div class="field"><label>Resin : Hardener Ratio</label><div class="ratios"><button data-r="1:1">1:1</button><button data-r="2:1" class="active">2:1</button><button data-r="3:1">3:1</button></div></div><div class="field"><label>Shape</label><div class="shapes"><button class="shape" data-shape="rectSquare"><span class="shape-icon rect"></span>Square / Rectangle</button><button class="shape" data-shape="circle"><span class="shape-icon circle"></span>Circle</button></div></div><div class="field"><label>Measurement Unit</label><div class="units"><label class="radio"><input type="radio" name="unit" value="inch" checked> Inches</label><label class="radio"><input type="radio" name="unit" value="cm"> Centimetres</label></div></div><div class="row"><div class="field"><label id="lLabel">Length (inch)</label><input id="l" type="number" min="0" step="1"></div><div class="field" id="widthField"><label id="wLabel">Width (inch)</label><input id="w" type="number" min="0" step="1"></div></div><div class="field" id="thicknessField"><label>Thickness (mm)</label><input id="t" type="number" min="0" step="1"></div><div class="field"><label class="rate-toggle"><input id="customRateEnabled" type="checkbox"> Customize Resin Rate</label><div id="customRateField" class="hidden" style="margin-top:10px"><label for="resinRate">Resin Cost per kg (₹)</label><input id="resinRate" type="number" min="0" step="1" value="900"></div></div><div class="result" id="result">Enter dimensions to calculate.</div><div style="font-size:11px;color:var(--muted);margin-top:8px" id="helpText">For Circle, enter the diameter. The Width field is hidden automatically.</div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{applySettings}from'./site-shell.js';const app=initializeApp({apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'}),db=getFirestore(app);let ratio='2:1',shape='rectSquare',unit='inch',mode='casting',DEFAULT_RATE=900;const $=id=>document.getElementById(id);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;updateFields();calc()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');ratio=b.dataset.r;calc()});document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-shape]').forEach(x=>x.classList.remove('active'));b.classList.add('active');shape=b.dataset.shape;updateFields();calc()});document.querySelector('[data-shape="rectSquare"]').classList.add('active');document.querySelectorAll('input[name="unit"]').forEach(r=>r.onchange=()=>{unit=r.value;updateLabels();calc()});['l','w','t'].forEach(id=>$(id).oninput=calc);$('customRateEnabled').onchange=()=>{ $('customRateField').classList.toggle('hidden',!$('customRateEnabled').checked);calc() };$('resinRate').oninput=calc;document.querySelectorAll('input[type="number"]').forEach(input=>input.addEventListener('wheel',e=>e.preventDefault(),{passive:false}));function updateLabels(){const u=unit==='cm'?'cm':'inch';$('lLabel').textContent=shape==='circle'?`Diameter (${u})`:`Length (${u})`;$('wLabel').textContent=`Width (${u})`}function updateFields(){const circle=shape==='circle';$('widthField').style.display=circle?'none':'block';$('thicknessField').classList.toggle('hidden',mode==='coating');$('helpText').textContent=mode==='coating'?'Coating mode: thickness is not required. Enter the surface dimensions only.':(circle?'For Circle, enter the diameter. The Width field is hidden automatically.':'For Square / Rectangle, enter length and width.');updateLabels();if(circle)$('w').value='';if(mode==='coating')$('t').value=''}function calc(){const L=Number($('l').value),W=Number($('w').value),T=Number($('t').value);if(!L||((shape==='rectSquare')&&!W)||(mode==='casting'&&!T)){$('result').innerHTML='Enter dimensions to calculate.';return}const cm=unit==='cm'?1:2.54,area=shape==='circle'?Math.PI*Math.pow((L*cm)/2,2):(L*cm)*(W*cm),volume=mode==='casting'?area*(T/10):0;if(mode==='coating'){$('result').innerHTML='<div class="total">Coating area: '+area.toFixed(1)+' cm²</div><div>Thickness is not required for coating mode.</div>';return}const parts=ratio.split(':').map(Number),total=parts[0]+parts[1],resin=volume*parts[0]/total,hard=volume*parts[1]/total,resinKg=resin/1000,rate=Number($('customRateEnabled').checked?$('resinRate').value:DEFAULT_RATE)||DEFAULT_RATE,cost=resinKg*rate;$('result').innerHTML='<div class="total">Total mix: '+volume.toFixed(1)+' ml</div><div>Resin: <strong>'+resin.toFixed(1)+' ml</strong> &nbsp; · &nbsp; Hardener: <strong>'+hard.toFixed(1)+' ml</strong></div><div class="cost">Estimated Resin Cost: <strong>₹'+cost.toFixed(2)+'</strong> <span style="font-size:11px;color:var(--muted)">('+rate.toLocaleString('en-IN')+'/kg)</span></div>'}async function load(){try{const s=await getDoc(doc(db,'config','settings')),st=s.exists()?s.data():{};applySettings(st);const cc=await getDoc(doc(db,'config','calculator'));if(cc.exists()){const d=cc.data();ratio=d.defaultRatio||ratio;unit=d.defaultUnit==='cm'?'cm':'inch';shape=d.defaultShape==='circle'?'circle':'rectSquare';mode=d.defaultMode==='coating'?'coating':'casting'}}catch(e){console.error(e)}document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('active',x.dataset.r===ratio));document.querySelector(`input[name="unit"][value="${unit}"]`).checked=true;document.querySelectorAll('[data-shape]').forEach(x=>x.classList.toggle('active',x.dataset.shape===shape));document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));updateFields();calc()}load();</script></body></html>
