<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resin Calculator | DESIGN_UR_THOUGHTS_01</title><style>body{margin:0;background:linear-gradient(135deg,#fff0f5,#fff9dc,#edfff9);font-family:Arial,sans-serif;color:#30263d}.wrap{max-width:720px;margin:50px auto;padding:20px}.box{background:#fff;border:1px solid #eadfe8;border-radius:25px;padding:28px;box-shadow:0 20px 50px #482d5315}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #eadfe8;border-radius:11px}.ratios{display:flex;gap:8px;flex-wrap:wrap}.ratios button{border:1px solid #eadfe8;background:#fff;padding:11px 18px;border-radius:999px;font-weight:800}.ratios button.active{background:linear-gradient(90deg,#ff8fab,#ffb36b);color:white;border-color:transparent}.toggle{display:flex;align-items:center;gap:10px;font-weight:700}.result{margin-top:20px;background:#fff4d8;border-radius:18px;padding:18px}.back{font-weight:700}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Back to DESIGN_UR_THOUGHTS_01</a><div class="box"><h1>Resin & Hardener Calculator</h1><p>Select 1:1, 2:1 or 3:1. Dimensions default to inches; use the toggle for centimetres. Thickness is always in mm.</p><div class="field"><label>Resin : Hardener Ratio</label><div class="ratios"><button data-r="1:1">1:1</button><button data-r="2:1">2:1</button><button data-r="3:1">3:1</button></div></div><div class="field toggle"><input id="unit" type="checkbox"> <span id="unitText">Use centimetres</span></div><div class="row"><div class="field"><label id="ll">Length (inch)</label><input id="l" type="number" min="0" step="0.01"></div><div class="field"><label id="lw">Width (inch)</label><input id="w" type="number" min="0" step="0.01"></div></div><div class="field"><label>Thickness (mm)</label><input id="t" type="number" min="0" step="0.1"></div><div class="result" id="result">Enter dimensions to calculate.</div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'}),db=getFirestore(app);let ratio='1:1';document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');ratio=b.dataset.r;calc()});document.querySelector('[data-r="1:1"]').classList.add('active');unit.onchange=()=>{ll.textContent=unit.checked?'Length (cm)':'Length (inch)';lw.textContent=unit.checked?'Width (cm)':'Width (inch)';calc()};[l,w,t].forEach(x=>x.oninput=calc);async function init(){try{const s=await getDoc(doc(db,'config','calculator'));if(s.exists()){ratio=s.data().defaultRatio||'1:1';unit.checked=(s.data().defaultUnit||'inch')==='cm';document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('active',x.dataset.r===ratio));unit.onchange()}}catch(e){}calc()}function calc(){const L=Number(l.value),W=Number(w.value),T=Number(t.value);if(!L||!W||!T){result.textContent='Enter dimensions to calculate.';return}const factor=unit.checked?1:2.54;const volume=L*W*T*factor*factor*0.1;const parts=ratio.split(':').map(Number),total=parts[0]+parts[1],resin=volume*parts[0]/total,hard=volume*parts[1]/total;result.innerHTML=`<strong>Total mix: ${volume.toFixed(1)} ml</strong><br>Resin: <strong>${resin.toFixed(1)} ml</strong><br>Hardener: <strong>${hard.toFixed(1)} ml</strong>`}init();</script></body></html>
