<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection | DESIGN_UR_THOUGHTS_01</title><meta name="description" content="Explore a DESIGN_UR_THOUGHTS_01 collection"><style>:root{--ink:#32283a;--muted:#746a78;--cream:#fffaf6;--gold:#b48a3b;--line:#eadfe4;--shadow:0 20px 55px #49324b18}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:130px}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.collection-hero{padding:70px 0 45px;background:linear-gradient(125deg,#fff1f5,#fff8e5,#effbf7);border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:800;color:#a0783d}.collection-hero h1{font:600 clamp(44px,7vw,70px)/1 'Cormorant Garamond',serif;margin:10px 0}.collection-hero p{max-width:700px;color:var(--muted);margin:0}.products{padding:55px 0 90px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 8px 30px #513a5010;transition:.3s}.card:hover{transform:translateY(-7px);box-shadow:var(--shadow)}.pic{aspect-ratio:1;background:linear-gradient(135deg,#fff0f3,#eefbf7,#f4effd);overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.pic-video{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;background:linear-gradient(135deg,#f4effd,#fff0f3)}.body{padding:19px 20px 21px}.body h2{font:600 25px 'Cormorant Garamond',serif;margin:0 0 3px}.body p{font-size:12.5px;color:var(--muted);min-height:40px}.meta{display:flex;justify-content:flex-end;margin-top:14px}.price{font-weight:800}.empty{padding:50px;text-align:center;border:1px dashed var(--line);color:var(--muted);background:#fff9f9}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.collection-hero{padding:50px 0 35px}}.suggestions{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:20px 0 75px}.suggestions-head{margin-bottom:18px}.suggestions-head h2{font:600 42px 'Cormorant Garamond',serif;margin:5px 0}.suggestions-head p{margin:0;color:var(--muted);font-size:13px}.suggestion-carousel{position:relative;overflow:hidden;padding:5px 2px 14px}.collection-track{display:flex;gap:14px;will-change:transform;transition:transform .65s ease}.collection-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:0 6px 20px #513a5010;transition:transform .3s,box-shadow .3s;flex:0 0 calc((100% - 56px)/5);min-width:0}.collection-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.collection-image{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#fff0f3,#eefbf7,#f4effd);overflow:hidden}.collection-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;display:block}.collection-slide.active{opacity:1}.collection-info{padding:10px 11px 11px;display:flex;align-items:center;justify-content:space-between;gap:7px}.collection-info h3{font:600 19px 'Cormorant Garamond',serif;margin:0;line-height:1.1}.collection-count{font-size:9px;color:var(--muted);margin-top:2px;font-weight:600}.collection-arrow{font-size:16px;color:var(--gold);flex:none}.carousel-control{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fffdfbde;color:var(--gold);box-shadow:0 5px 18px #513a5018;display:grid;place-items:center}.carousel-control.prev{left:6px}.carousel-control.next{right:6px}.suggestions .empty{padding:38px;text-align:center;border:1px dashed var(--line);color:var(--muted);background:#fff9f9}@media(max-width:1050px){.collection-card{flex-basis:calc((100% - 42px)/4)}}@media(max-width:850px){.collection-card{flex-basis:calc((100% - 28px)/3)}}@media(max-width:700px){.collection-card{flex-basis:calc((100% - 14px)/2)}.suggestions{width:min(100% - 24px,1180px)}.suggestions-head h2{font-size:34px}}@media(max-width:450px){.collection-card{flex-basis:100%}.collection-image{aspect-ratio:4/3}.collection-track{gap:10px}}</style></head><body><main><section class="collection-hero"><div class="wrap"><div class="eyebrow">The Collection</div><h1 id="collectionName">Loading…</h1><p id="collectionDescription"></p></div></section><section class="products"><div class="wrap"><div id="productGrid"></div></div></section></main><section class="suggestions" id="collectionSuggestions"><div class="suggestions-head"><div class="eyebrow">Find something you’ll love</div><h2>Explore Our Collections</h2><p>While browsing, explore our handcrafted collections and discover something special for your space or occasion.</p></div><div id="suggestionCatalog"><div class="empty">Loading collections…</div></div></section><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,doc,getDoc,getDocs,collection}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{renderShell,applySettings}from'./site-shell.js';renderShell();const app=initializeApp({apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'}),db=getFirestore(app);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');function driveId(url){const s=String(url||'').trim(),m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/i),q=s.match(/[?&]id=([^&]+)/i);return m?m[1]:(/drive\.google\.com/i.test(s)&&q?q[1]:'')}function imageUrl(url){const x=driveId(url);return x?`https://drive.google.com/thumbnail?id=${encodeURIComponent(x)}&sz=w1920`:String(url||'').trim()}function mediaList(p){if(Array.isArray(p.media)&&p.media.length)return p.media.filter(x=>x&&x.url).slice(0,5);return p.image?[{url:p.image,type:'image'}]:[]}function firstImage(p){const media=mediaList(p);return media.find(m=>(m.type||'image')!=='video')||media[0]||null}function productThumbnail(p){const media=Array.isArray(p.media)?p.media.filter(m=>m&&m.url&&(String(m.type||'image').toLowerCase()!=='video')):[];return media.length?media[0].url:(p.image||'')}let suggestionTimer=null,suggestionIndex=0;function suggestionVisibleCount(){if(innerWidth<=450)return 1;if(innerWidth<=700)return 2;if(innerWidth<=850)return 3;if(innerWidth<=1050)return 4;return 5}function moveSuggestions(step=1){const track=document.querySelector('.collection-track');if(!track)return;const cards=[...track.querySelectorAll('.collection-card')];if(cards.length<=suggestionVisibleCount())return;const visible=suggestionVisibleCount();suggestionIndex=(suggestionIndex+step+cards.length)%cards.length;const card=cards[suggestionIndex];const offset=card.offsetLeft;track.style.transform=`translateX(-${Math.max(0,offset)}px)`;if(suggestionIndex>cards.length-visible){suggestionIndex=0;track.style.transform='translateX(0)'}}function startSuggestionCarousel(){clearInterval(suggestionTimer);suggestionIndex=0;const track=document.querySelector('.collection-track');if(!track)return;track.style.transform='translateX(0)';if(track.querySelectorAll('.collection-card').length>suggestionVisibleCount())suggestionTimer=setInterval(()=>moveSuggestions(1),3000)}window.addEventListener('resize',()=>{clearInterval(suggestionTimer);startSuggestionCarousel()});async function loadSuggestions(){try{const[cs,ps]=await Promise.all([getDocs(collection(db,'categories')),getDocs(collection(db,'products'))]);const cats=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true})),products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);const cards=cats.map(c=>{const arr=products.filter(p=>String(p.categoryId||'')===String(c.id)||String(p.category||'').trim().toLowerCase()===String(c.name||'').trim().toLowerCase()),imgs=arr.map(productThumbnail).filter(Boolean).slice(0,5);return `<a class="collection-card" href="collection.html?id=${encodeURIComponent(c.id)}"><div class="collection-image">${imgs.length?imgs.map((u,i)=>`<img class="collection-slide ${i===0?'active':''}" src="${esc(imageUrl(u))}" alt="${esc(c.name)} product ${i+1}" loading="${i===0?'eager':'lazy'}">`).join(''):'<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;padding:0">No image yet</div>'}</div><div class="collection-info"><div><h3>${esc(c.name)}</h3><div class="collection-count">${arr.length} ${arr.length===1?'Product Available':'Products Available'}</div></div><span class="collection-arrow">→</span></div></a>`});const html=cats.length?`<div class="suggestion-carousel"><button class="carousel-control prev" type="button" aria-label="Previous collection" onclick="moveSuggestions(-1)">‹</button><div class="collection-track">${cards.join('')}</div><button class="carousel-control next" type="button" aria-label="Next collection" onclick="moveSuggestions(1)">›</button></div>`:'<div class="empty">Our collections are being curated.</div>';document.getElementById('suggestionCatalog').innerHTML=html;startSuggestionCarousel()}catch(e){console.error(e);document.getElementById('suggestionCatalog').innerHTML='<div class="empty">Unable to load collections right now.</div>'}}async function load(){try{const ss=await getDoc(doc(db,'config','settings'));const st=ss.exists()?ss.data():{};applySettings(st);const[cSnap,pSnap]=await Promise.all([getDocs(collection(db,'categories')),getDocs(collection(db,'products'))]);const cats=cSnap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false),products=pSnap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);const c=cats.find(x=>x.id===id);if(!c){document.getElementById('collectionName').textContent='Collection not found';document.getElementById('productGrid').innerHTML='<div class="empty">This collection is unavailable.</div>';return}renderShell({categories:cats});applySettings(st);document.title=`${c.name} | ${st.businessName||'DESIGN_UR_THOUGHTS_01'}`;document.getElementById('collectionName').textContent=c.name;document.getElementById('collectionDescription').textContent=c.description||'Explore handcrafted pieces from this collection.';const arr=products.filter(p=>p.categoryId===c.id||p.category===c.name);document.getElementById('productGrid').innerHTML=arr.length?`<div class="grid">${arr.map(p=>{const m=firstImage(p);const mediaHtml=m?((m.type||'image')==='video'?'<div class="pic-video">▶ Product Video</div>':`<img loading="lazy" src="${esc(imageUrl(m.url))}" alt="${esc(p.name)}" onerror="this.style.display='none'">`):'';return`<article class="card"><a href="product.html?id=${encodeURIComponent(p.id)}"><div class="pic">${mediaHtml}</div><div class="body"><h2>${esc(p.name)}</h2><p>${esc(p.description||'Handcrafted to order.')}</p><div class="meta"><span class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</span></div></div></a></article>`}).join('')}</div>`:'<div class="empty">No products are currently available in this collection.</div>'}catch(e){console.error(e);document.getElementById('collectionName').textContent='Unable to load collection';document.getElementById('productGrid').innerHTML='<div class="empty">Please try again shortly.</div>'}}load();loadSuggestions();</script></body></html>
