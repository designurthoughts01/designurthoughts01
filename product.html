<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | DESIGN_UR_THOUGHTS_01</title><meta name="description" content="Handcrafted resin art product details"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#32283a;--muted:#746a78;--cream:#fffaf6;--line:#eadfe4;--gold:#b48a3b;--gold2:#d8ad63;--shadow:0 20px 55px #49324b18}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,sans-serif;color:var(--ink);background:var(--cream)}body{min-height:100vh;display:flex;flex-direction:column}a{text-decoration:none;color:inherit}.content{flex:1;padding:42px 0 70px}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.box{background:#fffffff0;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:1.08fr .92fr}.gallery{min-height:560px;background:linear-gradient(135deg,#fff0f3,#eefbf7,#f4effd);display:flex;flex-direction:column}.main-media{position:relative;flex:1;min-height:500px;display:flex;align-items:center;justify-content:center;overflow:hidden}.main-media img{width:100%;height:100%;object-fit:cover}.main-media iframe{width:100%;height:100%;min-height:500px;border:0;background:#fff}.media-empty{color:var(--muted)}.thumbs{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line);overflow:auto}.thumb{flex:0 0 74px;height:58px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;overflow:hidden;padding:0}.thumb.active{border:2px solid var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb-video{width:100%;height:100%;display:grid;place-items:center;font-size:10px;color:var(--muted);background:linear-gradient(135deg,#f4effd,#fff0f3)}.info{padding:48px}.info h1{font:600 52px/1 'Cormorant Garamond',serif;margin:12px 0}.price{font-weight:800;font-size:20px}.desc{color:var(--muted);font-size:14px;margin:18px 0 28px}.options{display:grid;gap:15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:90px}.cta{margin-top:22px;width:100%;padding:14px;border:0;border-radius:99px;background:linear-gradient(100deg,#b98b4a,#d8ad63);color:#fff;font-weight:800;cursor:pointer}.note{font-size:11px;color:var(--muted);margin-top:12px}.error{padding:60px;text-align:center;display:block}.error a{display:inline-block;padding:10px 16px;border:1px solid var(--line);border-radius:99px;background:#fff}@media(max-width:760px){.box{grid-template-columns:1fr}.gallery{min-height:420px}.main-media{min-height:360px}.main-media iframe{min-height:360px}.info{padding:30px}.info h1{font-size:44px}}@media(max-width:560px){.wrap{width:min(100% - 24px,1180px)}.content{padding-top:24px}}.suggestions{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:20px 0 75px}.suggestions-head{margin-bottom:18px}.suggestions-head h2{font:600 42px 'Cormorant Garamond',serif;margin:5px 0}.suggestions-head p{margin:0;color:var(--muted);font-size:13px}.suggestion-carousel{position:relative;overflow:hidden;padding:5px 2px 14px}.collection-track{display:flex;gap:14px;will-change:transform;transition:transform .65s ease}.collection-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:0 6px 20px #513a5010;transition:transform .3s,box-shadow .3s;flex:0 0 calc((100% - 56px)/5);min-width:0}.collection-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.collection-image{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#fff0f3,#eefbf7,#f4effd);overflow:hidden}.collection-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;display:block}.collection-slide.active{opacity:1}.collection-info{padding:10px 11px 11px;display:flex;align-items:center;justify-content:space-between;gap:7px}.collection-info h3{font:600 19px 'Cormorant Garamond',serif;margin:0;line-height:1.1}.collection-count{font-size:9px;color:var(--muted);margin-top:2px;font-weight:600}.collection-arrow{font-size:16px;color:var(--gold);flex:none}.carousel-control{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fffdfbde;color:var(--gold);box-shadow:0 5px 18px #513a5018;display:grid;place-items:center}.carousel-control.prev{left:6px}.carousel-control.next{right:6px}.suggestions .empty{padding:38px;text-align:center;border:1px dashed var(--line);color:var(--muted);background:#fff9f9}@media(max-width:1050px){.collection-card{flex-basis:calc((100% - 42px)/4)}}@media(max-width:850px){.collection-card{flex-basis:calc((100% - 28px)/3)}}@media(max-width:700px){.collection-card{flex-basis:calc((100% - 14px)/2)}.suggestions{width:min(100% - 24px,1180px)}.suggestions-head h2{font-size:34px}}@media(max-width:450px){.collection-card{flex-basis:100%}.collection-image{aspect-ratio:4/3}.collection-track{gap:10px}}</style><script type="module">import './site-shell.js';</script></head><body><main class="content"><div class="wrap"><div id="app"></div></div></main><section class="suggestions" id="collectionSuggestions"><div class="suggestions-head"><div class="eyebrow">Find something you’ll love</div><h2>Explore Our Collections</h2><p>While browsing, explore our handcrafted collections and discover something special for your space or occasion.</p></div><div id="suggestionCatalog"><div class="empty">Loading collections…</div></div></section><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,doc,getDoc,getDocs,collection}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{applySettings}from'./site-shell.js';const app=initializeApp({apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'}),db=getFirestore(app),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const wa=n=>'https://wa.me/'+String(n||'').replace(/\D/g,'');function driveId(url){const s=String(url||'').trim(),m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/i),q=s.match(/[?&]id=([^&]+)/i);return m?m[1]:(/drive\.google\.com/i.test(s)&&q?q[1]:'')}function imageUrl(url){const x=driveId(url);return x?`https://drive.google.com/thumbnail?id=${encodeURIComponent(x)}&sz=w1920`:String(url||'').trim()}function videoUrl(url){const x=driveId(url);return x?`https://drive.google.com/file/d/${encodeURIComponent(x)}/preview`:String(url||'').trim()}const el=x=>document.getElementById(x);function mediaList(p){if(Array.isArray(p.media)&&p.media.length)return p.media.filter(x=>x&&x.url).slice(0,5);return p.image?[{url:p.image,type:'image'}]:[]}function mediaHtml(m){if((m.type||'image')==='video')return`<iframe src="${esc(videoUrl(m.url))}" title="Product video" allow="autoplay" allowfullscreen></iframe>`;return`<img src="${esc(imageUrl(m.url))}" alt="Product image">`}function productThumbnail(p){const media=Array.isArray(p.media)?p.media.filter(m=>m&&m.url&&(String(m.type||'image').toLowerCase()!=='video')):[];return media.length?media[0].url:(p.image||'')}let suggestionTimer=null,suggestionIndex=0;function suggestionVisibleCount(){if(innerWidth<=450)return 1;if(innerWidth<=700)return 2;if(innerWidth<=850)return 3;if(innerWidth<=1050)return 4;return 5}function moveSuggestions(step=1){const track=document.querySelector('.collection-track');if(!track)return;const cards=[...track.querySelectorAll('.collection-card')];if(cards.length<=suggestionVisibleCount())return;const visible=suggestionVisibleCount();suggestionIndex=(suggestionIndex+step+cards.length)%cards.length;const card=cards[suggestionIndex];const offset=card.offsetLeft;track.style.transform=`translateX(-${Math.max(0,offset)}px)`;if(suggestionIndex>cards.length-visible){suggestionIndex=0;track.style.transform='translateX(0)'}}function startSuggestionCarousel(){clearInterval(suggestionTimer);suggestionIndex=0;const track=document.querySelector('.collection-track');if(!track)return;track.style.transform='translateX(0)';if(track.querySelectorAll('.collection-card').length>suggestionVisibleCount())suggestionTimer=setInterval(()=>moveSuggestions(1),3000)}window.addEventListener('resize',()=>{clearInterval(suggestionTimer);startSuggestionCarousel()});async function loadSuggestions(){try{const[cs,ps]=await Promise.all([getDocs(collection(db,'categories')),getDocs(collection(db,'products'))]);const cats=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true})),products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);const cards=cats.map(c=>{const arr=products.filter(p=>String(p.categoryId||'')===String(c.id)||String(p.category||'').trim().toLowerCase()===String(c.name||'').trim().toLowerCase()),imgs=arr.map(productThumbnail).filter(Boolean).slice(0,5);return `<a class="collection-card" href="collection.html?id=${encodeURIComponent(c.id)}"><div class="collection-image">${imgs.length?imgs.map((u,i)=>`<img class="collection-slide ${i===0?'active':''}" src="${esc(imageUrl(u))}" alt="${esc(c.name)} product ${i+1}" loading="${i===0?'eager':'lazy'}">`).join(''):'<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;padding:0">No image yet</div>'}</div><div class="collection-info"><div><h3>${esc(c.name)}</h3><div class="collection-count">${arr.length} ${arr.length===1?'Product Available':'Products Available'}</div></div><span class="collection-arrow">→</span></div></a>`});const html=cats.length?`<div class="suggestion-carousel"><button class="carousel-control prev" type="button" aria-label="Previous collection" onclick="moveSuggestions(-1)">‹</button><div class="collection-track">${cards.join('')}</div><button class="carousel-control next" type="button" aria-label="Next collection" onclick="moveSuggestions(1)">›</button></div>`:'<div class="empty">Our collections are being curated.</div>';document.getElementById('suggestionCatalog').innerHTML=html;startSuggestionCarousel()}catch(e){console.error(e);document.getElementById('suggestionCatalog').innerHTML='<div class="empty">Unable to load collections right now.</div>'}}async function load(){try{const cfg=await getDoc(doc(db,'config','settings')),st=cfg.exists()?cfg.data():{};applySettings(st);if(!id){error('Product not specified.');return}const snap=await getDoc(doc(db,'products',id));if(!snap.exists()||snap.data().active===false){error('This product is currently unavailable.');return}const p={id:snap.id,...snap.data()},opts=Array.isArray(p.options)?p.options:[],media=mediaList(p);el('app').innerHTML=`<div class="box"><div class="gallery"><div class="main-media" id="mainMedia">${media.length?mediaHtml(media[0]):'<span class="media-empty">Product media</span>'}</div>${media.length>1?`<div class="thumbs">${media.map((m,i)=>`<button class="thumb ${i===0?'active':''}" type="button" data-media="${i}">${(m.type||'image')==='video'?'<span class="thumb-video">▶ Video</span>':`<img src="${esc(imageUrl(m.url))}" alt="Media ${i+1}">`}</button>`).join('')}</div>`:''}</div><div class="info"><h1>${esc(p.name||'Custom Resin Art')}</h1><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="desc">${esc(p.description||'Handcrafted to order and customised for you.')}</div><div class="options">${opts.map(field).join('')}<div class="field"><label>Special Request</label><textarea id="special" placeholder="Tell us anything else you would like customised..."></textarea></div></div><button class="cta" id="orderBtn">Request Custom Order on WhatsApp</button><div class="note">Estimated build time: ${esc(p.buildTime||'To be confirmed')}</div></div></div>`;document.querySelectorAll('[data-media]').forEach(btn=>btn.addEventListener('click',()=>{const i=Number(btn.dataset.media);el('mainMedia').innerHTML=mediaHtml(media[i]);document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}));el('orderBtn').onclick=()=>{const n=st.whatsappAdmin||st.whatsappNumber||st.whatsapp;if(!n){alert('WhatsApp contact is not configured yet.');return}const lines=[`Product: ${p.name}`,`Price: ₹${Number(p.price||0).toLocaleString('en-IN')}`,...opts.map((o,i)=>`${o.label}: ${el('opt'+i)?.value||''}`),`Special Request: ${el('special').value||''}`];location.href=wa(n)+'?text='+encodeURIComponent(lines.join('\n'))}}catch(e){console.error(e);error('Unable to load this product right now.')}}function field(o,i){const type=o.type||'select',label=esc(o.label||'Option');if(type==='textarea')return`<div class="field"><label>${label}</label><textarea id="opt${i}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;if(type==='text')return`<div class="field"><label>${label}</label><input id="opt${i}" placeholder="${esc(o.placeholder||'')}"></div>`;return`<div class="field"><label>${label}</label><select id="opt${i}"><option value="">Select ${label}</option>${(Array.isArray(o.values)?o.values:[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`}function error(t){el('app').innerHTML=`<div class="box error"><h1>${esc(t)}</h1><a href="index.html">Return to Home</a></div>`}load();</script></body></html>
