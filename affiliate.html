<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Dashboard | DESIGN_UR_THOUGHTS_01</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#32283a;--muted:#746a78;--cream:#fffaf6;--gold:#b48a3b;--gold2:#d8ad63;--line:#eadfe4;--ok:#4f8b72;--danger:#a95757;--shadow:0 20px 55px #49324b18}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px Manrope,sans-serif;background-image:radial-gradient(circle at 5% 5%,#f7e7ed80 0,transparent 28%),radial-gradient(circle at 95% 15%,#e8e0f780 0,transparent 28%)}button,input{font:inherit}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}input:focus{border-color:#c9a24b80;box-shadow:0 0 0 3px #b48a3b12}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:99px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(100deg,var(--gold),var(--gold2));color:#fff;border-color:transparent}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#ffffffeb;border:1px solid var(--line);padding:34px;width:min(450px,100%);border-radius:10px;box-shadow:var(--shadow)}h1,h2{font-family:'Cormorant Garamond',serif}.card h1{font-size:40px;margin:0 0 8px}.muted{color:var(--muted);font-size:12px}.field{margin:0 0 14px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:6px}.app{width:min(1180px,calc(100% - 36px));margin:auto;padding:45px 0 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap;margin-bottom:28px}.top h1{font-size:52px;line-height:1;margin:0}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}.stat{background:#fff;border:1px solid var(--line);padding:24px;border-radius:8px;box-shadow:0 8px 30px #513a500b}.stat b{display:block;font:600 36px/1 'Cormorant Garamond',serif;color:#a0783d;margin-bottom:6px}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.code{display:inline-block;padding:7px 12px;border-radius:99px;background:#fff1d9;border:1px solid #ead4a8;font-weight:800;letter-spacing:.08em}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px #513a500b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:#fffafc}.live{color:var(--ok)}.off{color:var(--danger)}@media(max-width:700px){.app{width:min(100% - 24px,1180px)}.stats{grid-template-columns:1fr}.top h1{font-size:42px}}</style></head><body><section id="login" class="login"><div class="card"><div class="muted">DESIGN_UR_THOUGHTS_01</div><h1>Affiliate Dashboard</h1><p class="muted">Sign in with the email registered by the admin.</p><div id="msg" class="muted"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="signIn()">Sign In</button><button class="btn" style="width:100%;margin-top:8px" onclick="showSignup()">Create Affiliate Login</button><button class="btn" style="width:100%;margin-top:8px" onclick="resetPassword()">Forgot Password</button><div id="signupBox" class="hidden" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--line)"><div class="field"><label>Promo Code Given by Admin</label><input id="signupCode" placeholder="PROMO CODE"></div><button class="btn primary" style="width:100%" onclick="signup()">Create Login</button></div></div></section><main id="app" class="app hidden"><div class="top"><div><div class="muted">AFFILIATE PORTAL</div><h1 id="name">Welcome</h1><div><span class="code" id="code">—</span> <span class="muted" id="rate"></span></div></div><div class="actions"><a class="btn" href="index.html">View Store</a><button class="btn" onclick="logout()">Log Out</button></div></div><div class="stats"><div class="stat"><b id="orderCount">0</b><span>Attributed Orders</span></div><div class="stat"><b id="sales">₹0</b><span>Order Value</span></div><div class="stat"><b id="commission">₹0</b><span>Commission Earned</span></div></div><div class="table"><table><thead><tr><th>Order</th><th>Customer</th><th>Order Amount</th><th>Commission</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';const cfg={apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'},app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),date=x=>{try{return new Date(x).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch{return'—'}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));window.showSignup=()=>{$('signupBox').classList.toggle('hidden')};window.signup=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value,code=$('signupCode').value.trim().toUpperCase().replace(/\\s+/g,'');if(!email||password.length<6||!code){$('msg').textContent='Enter email, a password of at least 6 characters and the promo code given by admin.';return}try{await createUserWithEmailAndPassword(auth,email,password);const snap=await getDocs(query(collection(db,'affiliates'),where('email','==',email)));if(snap.empty||snap.docs[0].data().active===false||String(snap.docs[0].data().promoCode||'').toUpperCase()!==code){await signOut(auth);$('msg').textContent='The email and promo code do not match an active affiliate profile. Please contact admin.';return}$('msg').textContent='Login created successfully.'}catch(e){console.error(e);$('msg').textContent=e.code==='auth/email-already-in-use'?'This email already has a login. Please sign in.':'Could not create login. '+(e.message||'Please try again.')}};window.signIn=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('msg').textContent=''}catch(e){$('msg').textContent='Sign in failed. Check your email and password.'}};window.logout=()=>signOut(auth);window.resetPassword=async()=>{const email=$('email').value.trim();if(!email)return $('msg').textContent='Enter your email first.';try{await sendPasswordResetEmail(auth,email);$('msg').textContent='Password reset email sent.'}catch(e){$('msg').textContent='Could not send reset email.'}};onAuthStateChanged(auth,async u=>{if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{const email=(u.email||'').toLowerCase();const snap=await getDocs(query(collection(db,'affiliates'),where('email','==',email)));if(snap.empty||snap.docs[0].data().active===false){await signOut(auth);$('msg').textContent='Your affiliate account is not active. Please contact the admin.';return}const a={id:snap.docs[0].id,...snap.docs[0].data()};$('login').classList.add('hidden');$('app').classList.remove('hidden');$('name').textContent=a.name||'Affiliate';$('code').textContent=a.promoCode||'—';$('rate').textContent='Commission rate: '+Number(a.commissionPercent||0)+'%';const os=await getDocs(query(collection(db,'orders'),where('affiliateId','==',a.id)));const orders=os.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));const sales=orders.reduce((s,o)=>s+Number(o.total||0),0),comm=orders.reduce((s,o)=>s+Number(o.affiliateCommission||0),0);$('orderCount').textContent=orders.length;$('sales').textContent=money(sales);$('commission').textContent=money(comm);$('rows').innerHTML=orders.length?orders.map(o=>'<tr><td>'+esc(o.id.slice(0,8))+'…<br><span class="muted">'+esc(o.promoCode||'')+'</span></td><td>'+esc(o.customerName||'—')+'</td><td>'+money(o.total)+'</td><td>'+money(o.affiliateCommission)+'</td><td><span class="'+(o.status==='Cancelled'?'off':'live')+'">'+esc(o.status||'New')+'</span></td><td>'+date(o.createdAt)+'</td></tr>').join(''):'<tr><td colspan="6" style="text-align:center;padding:45px;color:#746a78">No orders have been attributed to your promo code yet.</td></tr>'}catch(e){console.error(e);$('msg').textContent='Unable to load affiliate data right now.'}});</script></body></html>
