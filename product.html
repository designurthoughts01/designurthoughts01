<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | DESIGN_UR_THOUGHTS_01</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#32283a;--muted:#746a78;--cream:#fffaf6;--gold:#b48a3b;--rose:#e7a1b2;--lilac:#c6b6e9;--sage:#a8d8c9;--line:#eadfe4;--shadow:0 25px 70px #49324b20}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,sans-serif}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{position:sticky;top:0;z-index:100;background:#fffaf6e8;backdrop-filter:blur(18px);border-bottom:1px solid #eadfe4aa}.bar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font:700 25px 'Cormorant Garamond',serif;letter-spacing:.04em}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--rose),var(--lilac),var(--sage))}.mark:after{content:'✦';color:#fff}.nav{display:flex;gap:9px;align-items:center}.nav-btn{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:30px;font-weight:700;font-size:12px}.cat-menu{position:relative}.cat-list{display:none;position:absolute;right:0;top:49px;width:310px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:12px}.cat-menu.open .cat-list{display:block}.cat-item{padding:12px}.sublist{display:flex;flex-wrap:wrap;gap:5px;padding-top:7px}.sublist a{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.content{padding:42px 0 70px;min-height:65vh;background:linear-gradient(180deg,#fffaf600,#fffaf6)}.box{background:#fffffff0;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.photo{min-height:560px;background:linear-gradient(135deg,#ffe7ee,#edf9f5,#f4effd);display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:48px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800}.info h1{font:600 52px/1 'Cormorant Garamond',serif;margin:12px 0}.price{font-weight:800;font-size:20px}.desc{color:var(--muted);font-size:14px;margin:18px 0 28px}.options{display:grid;gap:15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.cta{margin-top:22px;width:100%;padding:14px;border:0;border-radius:99px;background:linear-gradient(100deg,#b98b4a,#d8ad63);color:#fff;font-weight:800}.note{font-size:11px;color:var(--muted);margin-top:12px}.footer{background:#332a38;color:#fff;padding:50px 0}.foot{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}.foot-brand{font:700 28px 'Cormorant Garamond',serif}.social{display:flex;gap:8px;flex-wrap:wrap}.social a{border:1px solid #ffffff25;border-radius:99px;padding:9px 14px;font-size:12px}.error{padding:60px;text-align:center}@media(max-width:760px){.nav-btn.hide-mobile{display:none}.brand{font-size:21px}.box{grid-template-columns:1fr}.photo{min-height:360px}.info{padding:30px}.info h1{font-size:44px}}@media(max-width:560px){.wrap{width:min(100% - 24px,1180px)}.bar{height:68px}.brand{font-size:19px}.mark{width:30px;height:30px}}</style></head><body><header class="top"><div class="wrap bar"><a class="brand" href="index.html"><span class="mark"></span><span id="brand">DESIGN_UR_THOUGHTS_01</span></a><nav class="nav"><div class="cat-menu" id="catMenu"><button class="nav-btn" onclick="toggleCats()">Collection ▾</button><div class="cat-list" id="catList"></div></div><a class="nav-btn" href="resin-calculator.html">Resin Calculator</a><a class="nav-btn" id="waTop" target="_blank">WhatsApp</a><a class="nav-btn" id="igTop" target="_blank">Instagram</a><a class="nav-btn" id="ytTop" target="_blank">YouTube</a></nav></div></header><main class="content"><div class="wrap"><div id="app"></div></div></main><footer class="footer"><div class="wrap foot"><div><div class="foot-brand" id="footName">DESIGN_UR_THOUGHTS_01</div><div style="opacity:.65;font-size:12px">Resin Art · Keepsakes · Bespoke Décor</div></div><div class="social"><a id="wa" target="_blank">WhatsApp</a><a id="ig" target="_blank">Instagram</a><a id="yt" target="_blank">YouTube</a></div></div></footer><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getFirestore,doc,getDoc,getDocs,collection}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyCjgnQm9br-lgHi4OIqDuIhPIdVjyP82Cc',authDomain:'designurthoughts01-bb2cd.firebaseapp.com',projectId:'designurthoughts01-bb2cd',storageBucket:'designurthoughts01-bb2cd.firebasestorage.app',messagingSenderId:'657811510206',appId:'1:657811510206:web:464d88e44cbc0dc3135fef'}),db=getFirestore(app);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const wa=n=>'https://wa.me/'+String(n||'').replace(/\D/g,'');const id=new URLSearchParams(location.search).get('id');function setLink(id,href){document.getElementById(id).href=href}async function load(){const cfg=await getDoc(doc(db,'config','settings'));const st=cfg.exists()?cfg.data():{};const name=st.businessName||'DESIGN_UR_THOUGHTS_01';document.title=`Product | ${name}`;document.getElementById('brand').textContent=name;document.getElementById('footName').textContent=name;if(st.whatsappAdmin){const x=wa(st.whatsappAdmin);setLink('wa',x);setLink('waTop',x)}if(st.instagram){const x='https://instagram.com/'+String(st.instagram).replace(/^@/,'');setLink('ig',x);setLink('igTop',x)}if(st.youtube){setLink('yt',st.youtube);setLink('ytTop',st.youtube)}const cs=await getDocs(collection(db,'categories'));const cats=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false);document.getElementById('catList').innerHTML=cats.map(c=>`<div class="cat-item"><a href="index.html#cat-${c.id}"><b>${esc(c.name)}</b></a>${(c.subcategories||[]).filter(s=>s.active!==false).length?`<div class="sublist">${c.subcategories.filter(s=>s.active!==false).map(s=>`<a href="index.html#cat-${c.id}">${esc(s.name)}</a>`).join('')}</div>`:''}</div>`).join('')||'<div class="cat-item">No collections yet.</div>';if(!id){showError('Product not specified.');return}const s=await getDoc(doc(db,'products',id));if(!s.exists()||s.data().active===false){showError('This product is currently unavailable.');return}const p={id:s.id,...s.data()};const opts=Array.isArray(p.options)?p.options:[];document.title=`${p.name||'Product'} | ${name}`;document.getElementById('app').innerHTML=`<div class="box"><div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<span>Product image</span>'}</div><div class="info"><div class="eyebrow">${esc(p.subcategory||'Bespoke')}</div><h1>${esc(p.name||'Custom Resin Art')}</h1><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="desc">${esc(p.description||'Handcrafted to order and customised for you.')}</div><div class="options">${opts.map((o,i)=>field(o,i)).join('')}<div class="field"><label>Special Request</label><textarea id="special" placeholder="Tell us anything else you'd like customised..."></textarea></div></div><button class="cta" id="order">Request Custom Order on WhatsApp</button><div class="note">Estimated build time: ${esc(p.buildTime||'To be confirmed')}</div></div></div>`;document.getElementById('order').onclick=()=>{const phone=st.whatsappAdmin||'';const lines=[`Product: ${p.name}`,`Price: ₹${Number(p.price||0).toLocaleString('en-IN')}`,...opts.map((o,i)=>`${o.label}: ${document.getElementById('opt'+i)?.value||''}`),`Special Request: ${document.getElementById('special').value}`];location.href=wa(phone)+'?text='+encodeURIComponent(lines.join('\n'))}}function field(o,i){const type=o.type||'select';if(type==='textarea')return `<div class="field"><label>${esc(o.label)}</label><textarea id="opt${i}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;if(type==='text')return `<div class="field"><label>${esc(o.label)}</label><input id="opt${i}" placeholder="${esc(o.placeholder||'')}"></div>`;const vals=Array.isArray(o.values)?o.values:[];return `<div class="field"><label>${esc(o.label)}</label><select id="opt${i}"><option value="">Select ${esc(o.label)}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`}function showError(t){document.getElementById('app').innerHTML=`<div class="box error"><h1>${esc(t)}</h1><a class="nav-btn" href="index.html">Return to collection</a></div>`}function toggleCats(){document.getElementById('catMenu').classList.toggle('open')}window.toggleCats=toggleCats;document.addEventListener('click',e=>{if(!document.getElementById('catMenu').contains(e.target))document.getElementById('catMenu').classList.remove('open')});load().catch(e=>{console.error(e);showError('Unable to load this product right now.')});</script></body></html>
