div><div class="options">${opts.map(field).join('')}<div class="field"><label>Special Request</label><textarea id="special" placeholder="Tell us anything else you would like customised..."></textarea></div></div><button class="cta" id="orderBtn">Request Custom Order on WhatsApp</button><div class="note">Estimated build time: ${esc(p.buildTime||'To be confirmed')}</div></div></div>`;el('orderBtn').onclick=()=>{const n=st.whatsappAdmin||st.whatsappNumber||st.whatsapp;if(!n){alert('WhatsApp contact is not configured yet.');return}const lines=[`Product: ${p.name}`,`Price: ₹${Number(p.price||0).toLocaleString('en-IN')}`,...opts.map((o,i)=>`${o.label}: ${el('opt'+i)?.value||''}`),`Special Request: ${el('special').value||''}`];location.href=wa(n)+'?text='+encodeURIComponent(lines.join('\n'))}}function field(o,i){const type=o.type||'select',label=esc(o.label||'Option');if(type==='textarea')return `<div class="field"><label>${label}</label><textarea id="opt${i}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;if(type==='text')return `<div class="field"><label>${label}</label><input id="opt${i}" placeholder="${esc(o.placeholder||'')}"></div>`;return `<div class="field"><label>${label}</label><select id="opt${i}"><option value="">Select ${label}</option>${(Array.isArray(o.values)?o.values:[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`}function error(t){el('app').innerHTML=`<div class="box error"><h1>${esc(t)}</h1><a href="index.html">Return to Home</a></div>`}load().catch(e=>{console.error(e);error('Unable to load this product right now.')});</script></body></html>
